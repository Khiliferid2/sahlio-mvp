<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sahlio Pro — لوحة الحرفي</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="logo">Sahlio <span class="small" style="color:var(--gold);">Pro</span></div>
  <nav>
    <a href="index.html">أنا حريف</a>
    <a href="provider.html">أنا حرفي</a>
  </nav>
</header>

<div class="wrap">
  <div id="auth-view">
    <h1>لوحة الحرفي</h1>
    <p class="lead">حل كومبت Pro أو دخل باش تشوف الطلبات القريبة منك.</p>
    <div class="tabs">
      <div class="tab active" data-tab="login">تسجيل الدخول</div>
      <div class="tab" data-tab="register">كومبت جديد</div>
    </div>
    <div class="card" id="login-form">
      <div class="field"><label>رقم الهاتف</label><input id="li-phone" placeholder="9XXXXXXX"></div>
      <div class="field"><label>كلمة السر</label><input id="li-pass" type="password"></div>
      <button onclick="doLogin()">دخول</button>
      <div class="error" id="li-error"></div>
    </div>
    <div class="card hidden" id="register-form">
      <div class="field"><label>الاسم الكامل</label><input id="re-name"></div>
      <div class="field"><label>رقم الهاتف</label><input id="re-phone" placeholder="9XXXXXXX"></div>
      <div class="field"><label>كلمة السر</label><input id="re-pass" type="password"></div>
      <button onclick="doRegister()">حل كومبت Pro</button>
      <div class="error" id="re-error"></div>
    </div>
  </div>

  <div id="main-view" class="hidden">
    <h1>أهلاً <span id="who"></span> 🛠️</h1>
    <button class="ghost" onclick="API.logout()" style="float:left;">خروج</button>

    <h2>1. حدد زون الخدمة متاعك</h2>
    <div class="card">
      <div class="field">
        <label>البلاصة الأساسية</label>
        <select id="p-zone">
          <option>تونس</option><option>أريانة</option><option>بن عروس</option><option>منوبة</option>
        </select>
      </div>
      <div class="field">
        <label>نطاق التنقل (كم)</label>
        <input id="p-radius" type="number" value="10">
      </div>
      <button onclick="saveLocation()">حفظ البلاصة</button>
      <div class="error" id="loc-error"></div>
    </div>

    <h2>2. الخدمات إلي تعملها</h2>
    <div class="card">
      <div class="field">
        <label>زيد خدمة</label>
        <select id="p-service"></select>
      </div>
      <button onclick="addService()">زيد</button>
      <div id="my-services" style="margin-top:12px;"></div>
    </div>

    <h2>3. الطلبات القريبة منك</h2>
    <div class="card" id="nearby-requests"><p class="small">حدد بلاصتك وخدماتك باش تبان الطلبات.</p></div>
  </div>
</div>

<script src="api.js"></script>
<script src="provider.js"></script>
</body>
</html>
